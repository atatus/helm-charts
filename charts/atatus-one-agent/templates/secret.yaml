{{- if not .Values.atatus.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "atatus-one-agent.licenseSecret" . }}
  labels:
    {{- include "atatus-one-agent.labels" . | nindent 4 }}
type: Opaque
data:
  license-key: {{ .Values.atatus.license_key | b64enc | quote }}
{{- end }}
