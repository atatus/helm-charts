apiVersion: v2
name: atatus-agent
type: application
description: Official helm chart for Atatus Agent
# MAJOR: cluster-scoped metricsets now come from a single Deployment replica
# instead of every DaemonSet pod. See CHANGELOG.md before upgrading.
version: 2.0.0
# Carries the int_metrics.go gating that makes `metrics.enabled` / `event.enabled`
# take effect. Must be pushed to the registry BEFORE packaging the chart --
# the rendered image is atatus/atatus-infra-agent:<appVersion>.
appVersion: 4.2.0
keywords:
  - atatus
  - observability
  - monitoring
  - logging
  - kubernetes
  - metrics
  - agent
maintainers:
  - name: Atatus
    email: success@atatus.com
home: https://www.atatus.com/
icon: https://www.atatus.com/images/logo/atatus-icon.png
dependencies:
  - name: "kube-state-metrics"
    version: "7.2.2"
    repository: "https://prometheus-community.github.io/helm-charts"
    condition: atatus.state_metrics.enabled
