# Charts up to 1.7.0 created these bindings under other names and pointed them
# at a ClusterRole instead of the Roles in role.yaml. roleRef cannot be changed
# on an existing binding, so reusing those names made upgrades fail with
# "cannot change roleRef". New names make Helm create these bindings and delete
# the old ones instead.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "atatus-agent.serviceAccount" . }}-role-rolebinding
  labels:
    app: "{{ template "atatus-agent.fullname" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
roleRef:
  kind: Role
  name: {{ template "atatus-agent.serviceAccount" . }}-role
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: {{ template "atatus-agent.serviceAccount" . }}
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ template "atatus-agent.serviceAccount" . }}-kubeadm-config-rolebinding
  labels:
    app: "{{ template "atatus-agent.fullname" . }}"
    chart: "{{ .Chart.Name }}-{{ .Chart.Version }}"
    heritage: {{ .Release.Service | quote }}
    release: {{ .Release.Name | quote }}
roleRef:
  kind: Role
  name: {{ template "atatus-agent.serviceAccount" . }}-kubeadm-config
  apiGroup: rbac.authorization.k8s.io
subjects:
- kind: ServiceAccount
  name: {{ template "atatus-agent.serviceAccount" . }}
  namespace: {{ .Release.Namespace }}
---